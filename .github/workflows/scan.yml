name: Veille marchés publics

on:
  schedule:
    - cron: "40 4 * * 1-5"   # 6h40 heure de Paris (été) / 5h40 (hiver), avant le récap Claude
  workflow_dispatch:
    inputs:
      jours:
        description: "Fenêtre de recherche en jours"
        default: "10"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scanner BOAMP + TED
        env:
          VEILLE_JOURS: ${{ github.event.inputs.jours || '10' }}
        run: python scanner/scan.py
      - name: Enregistrer les résultats
        run: |
          git config user.name "veille-impulse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Veille du $(date +%F)"
          git push
